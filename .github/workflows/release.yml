# Release pipeline — builds gtm + gtmd for Linux (x86_64, ARM) and macOS.
#
# Pipeline:
#
#   tag job         → derive version, ensure tag exists
#     │
#     ▼
#   build job       → for each OS/arch:
#     │                1. nimble build --release (nim c -d:release)
#     │                2. Package archives:
#     │                   gtm-full-{platform}.tar.gz  (gtm + gtmd + completions)
#     │                   gtmd-{platform}.tar.gz      (gtmd only)
#     │                   gtm-{platform}.tar.gz       (gtm only + completions)
#     │                3. Upload build artifacts
#     │
#     ▼
#   release job     → create GitHub Release with all archives
#
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Delete and recreate tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          tag="${{ steps.set-tag.outputs.tag }}"
          git tag -d "${tag}" 2>/dev/null || true
          git push origin ":refs/tags/${tag}" 2>/dev/null || true
          git tag "${tag}"
          git push origin "${tag}" --force

  build:
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux
          - os: macos-latest
            platform: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install ffmpeg pkg-config

      - name: Install Nim via choosenim
        run: |
          if ! command -v nim &>/dev/null; then
            curl https://nim-lang.org/choosenim/init.sh -sSf | bash -s -- -y
            echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          fi

      - name: Install nimble dependencies
        run: |
          nimble install -y --depsOnly
          echo "=== Package directories ==="
          ls -d ~/.nimble/pkgs2/*/  2>/dev/null || true
          NIMWAVE_DIR=$(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name 'nimwave*' 2>/dev/null | head -1)
          ILLWAVE_DIR=$(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name 'illwave*' 2>/dev/null | head -1)
          ANSIUTILS_DIR=$(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name 'ansiutils*' 2>/dev/null | head -1)
          echo "NIMWAVE=$NIMWAVE_DIR ILLWAVE=$ILLWAVE_DIR ANSIUTILS=$ANSIUTILS_DIR"
          if [ -n "$NIMWAVE_DIR" ]; then echo "NIMWAVE_PATH=$NIMWAVE_DIR" >> "$GITHUB_ENV"; fi
          if [ -n "$ILLWAVE_DIR" ]; then echo "ILLWAVE_PATH=$ILLWAVE_DIR" >> "$GITHUB_ENV"; fi
          if [ -n "$ANSIUTILS_DIR" ]; then echo "ANSIUTILS_PATH=$ANSIUTILS_DIR" >> "$GITHUB_ENV"; fi

      - name: Build release binaries
        run: |
          nim c -d:release src/gtm.nim
          nim c -d:release src/gtmd.nim

      - name: Locate binaries
        id: bins
        shell: bash
        run: |
          echo "=== Searching for gtm/gtmd ==="
          find . -maxdepth 3 -type f \( -name "gtm" -o -name "gtmd" \) ! -path "./.git/*" ! -path "./nimcache/*" 2>/dev/null
          echo "=== ~/.nimble/bin ==="
          ls -la ~/.nimble/bin/gtm* 2>/dev/null || true
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || true

      - name: Package binaries
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          find_binary() {
            local name="$1"
            for p in "bin/$name" "$name"; do
              [ -f "$p" ] && { echo "$p"; return 0; }
            done
            local found
            found=$(find . -maxdepth 3 -type f -name "$name" ! -path "./.git/*" ! -path "./nimcache/*" 2>/dev/null | head -1)
            [ -n "$found" ] && { echo "$found"; return 0; }
            echo "ERROR: $name not found" >&2; return 1
          }
          GTM_BIN=$(find_binary gtm)
          GTMD_BIN=$(find_binary gtmd)
          echo "GTM_BIN=$GTM_BIN GTMD_BIN=$GTMD_BIN"
          cp "$GTM_BIN" "gtm-${platform}"
          cp "$GTMD_BIN" "gtmd-${platform}"

          # Shell completions at archive root
          for c in "completions/gtm.bash" "completions/_gtm" "completions/gtm.fish"; do
            if [ -f "$c" ]; then
              cp "$c" "$(basename "$c")"
            fi
          done

          # gtm-full: gtm + gtmd + completions
          tar czf "gtm-full-${platform}.tar.gz" \
            "gtm-${platform}" \
            "gtmd-${platform}" \
            gtm.bash \
            _gtm \
            gtm.fish

          # gtmd: daemon binary only
          tar czf "gtmd-${platform}.tar.gz" \
            "gtmd-${platform}"

          # gtm: TUI/CLI binary + completions
          tar czf "gtm-${platform}.tar.gz" \
            "gtm-${platform}" \
            gtm.bash \
            _gtm \
            gtm.fish

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            gtm-full-*.tar.gz
            gtmd-*.tar.gz
            gtm-*.tar.gz

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true

      - name: Collect release files
        run: |
          echo "=== Release artifacts ==="
          find . -type f \( -name "gtm-full-*" -o -name "gtmd-*" -o -name "gtm-*" \) | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            gtm-full-*.tar.gz
            gtmd-*.tar.gz
            gtm-*.tar.gz

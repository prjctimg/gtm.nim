# Release pipeline — builds gtm + gtmd for Linux (x86_64, ARM) and macOS.
#
# Pipeline:
#
#   tag job         → derive version, ensure tag exists
#     │
#     ▼
#   build job       → for each OS/arch:
#     │                1. nimble build --release (nim c -d:release)
#     │                2. Generate manpages (pandoc)
#     │                3. Package archives:
#     │                   gtm-full-{platform}.tar.gz  (gtm + gtmd + man)
#     │                   gtmd-{platform}.tar.gz      (gtmd only + daemon man)
#     │                   gtm-{platform}.tar.gz       (gtm only + gtm man)
#     │                4. Upload build artifacts
#     │
#     ▼
#   release job     → create GitHub Release with all archives + manpages
#
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive tag
        id: set-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Delete and recreate tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          tag="${{ steps.set-tag.outputs.tag }}"
          git tag -d "${tag}" 2>/dev/null || true
          git push origin ":refs/tags/${tag}" 2>/dev/null || true
          git tag "${tag}"
          git push origin "${tag}" --force

  build:
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: x86_64-linux
          - os: macos-latest
            platform: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pandoc

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install pandoc ffmpeg pkg-config

      - name: Install Nim via choosenim
        run: |
          if ! command -v nim &>/dev/null; then
            curl https://nim-lang.org/choosenim/init.sh -sSf | bash -s -- -y
            echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          fi

      - name: Clone gtm.spec
        run: |
          git clone https://github.com/prjctimg/gtm.spec.git

      - name: Install nimble dependencies
        run: |
          nimble install -y --depsOnly
          echo "=== Package directories ==="
          ls -d ~/.nimble/pkgs2/*/  2>/dev/null || true
          NIMWAVE_DIR=$(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name 'nimwave*' 2>/dev/null | head -1)
          ILLWAVE_DIR=$(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name 'illwave*' 2>/dev/null | head -1)
          ANSIUTILS_DIR=$(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name 'ansiutils*' 2>/dev/null | head -1)
          echo "NIMWAVE=$NIMWAVE_DIR ILLWAVE=$ILLWAVE_DIR ANSIUTILS=$ANSIUTILS_DIR"
          if [ -n "$NIMWAVE_DIR" ]; then echo "NIMWAVE_PATH=$NIMWAVE_DIR" >> "$GITHUB_ENV"; fi
          if [ -n "$ILLWAVE_DIR" ]; then echo "ILLWAVE_PATH=$ILLWAVE_DIR" >> "$GITHUB_ENV"; fi
          if [ -n "$ANSIUTILS_DIR" ]; then echo "ANSIUTILS_PATH=$ANSIUTILS_DIR" >> "$GITHUB_ENV"; fi

      - name: Build release binaries
        run: |
          nim c -d:release src/gtm.nim
          nim c -d:release src/gtmd.nim

      - name: Locate binaries
        id: bins
        shell: bash
        run: |
          echo "=== Searching for gtm/gtmd ==="
          find . -maxdepth 3 -type f \( -name "gtm" -o -name "gtmd" \) ! -path "./.git/*" ! -path "./nimcache/*" 2>/dev/null
          echo "=== ~/.nimble/bin ==="
          ls -la ~/.nimble/bin/gtm* 2>/dev/null || true
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || true

      - name: Generate manpages
        run: |
          mkdir -p artifacts/man
          for md in gtm.spec/man/*.1.md; do
            name=$(basename "$md" .1.md)
            pandoc "$md" -s -t man -o "artifacts/man/${name}.1"
          done

      - name: Package binaries
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          find_binary() {
            local name="$1"
            for p in "bin/$name" "$name"; do
              [ -f "$p" ] && { echo "$p"; return 0; }
            done
            local found
            found=$(find . -maxdepth 3 -type f -name "$name" ! -path "./.git/*" ! -path "./nimcache/*" 2>/dev/null | head -1)
            [ -n "$found" ] && { echo "$found"; return 0; }
            echo "ERROR: $name not found" >&2; return 1
          }
          GTM_BIN=$(find_binary gtm)
          GTMD_BIN=$(find_binary gtmd)
          echo "GTM_BIN=$GTM_BIN GTMD_BIN=$GTMD_BIN"
          cp "$GTM_BIN" "gtm-${platform}"
          cp "$GTMD_BIN" "gtmd-${platform}"

          # gtm-full: gtm + gtmd + all manpages
          tar czf "gtm-full-${platform}.tar.gz" \
            "gtm-${platform}" \
            "gtmd-${platform}" \
            artifacts/man/gtm.1 \
            artifacts/man/gtmd.1 \
            artifacts/man/gtm-config.1 \
            artifacts/man/gtm-keybindings.1 \
            artifacts/man/gtm-protocol.1

          # gtmd: daemon binary + daemon manpage
          tar czf "gtmd-${platform}.tar.gz" \
            "gtmd-${platform}" \
            artifacts/man/gtmd.1

          # gtm: TUI/CLI binary + gtm manpage
          tar czf "gtm-${platform}.tar.gz" \
            "gtm-${platform}" \
            artifacts/man/gtm.1

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            gtm-full-*.tar.gz
            gtmd-*.tar.gz
            gtm-*.tar.gz
            artifacts/man/*

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true

      - name: Collect release files
        run: |
          echo "=== Release artifacts ==="
          find . -type f \( -name "gtm-full-*" -o -name "gtmd-*" -o -name "gtm-*" -o -path "*/man/*" \) | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            gtm-full-*.tar.gz
            gtmd-*.tar.gz
            gtm-*.tar.gz
            artifacts/man/*
